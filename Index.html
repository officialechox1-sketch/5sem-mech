<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#14243a">
  <title>5-Sem Mech | Student Details</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;background:#f2f5f9;color:#172337;display:flex;align-items:center;justify-content:center;padding:22px}
    .card{width:100%;max-width:480px;background:#fff;border:1px solid #e1e7ef;border-radius:18px;padding:28px;box-shadow:0 12px 35px rgba(20,36,58,.09)}
    .top{text-align:center;margin-bottom:24px}
    .mark{width:52px;height:52px;border-radius:15px;background:#14243a;color:#fff;display:grid;place-items:center;font-size:22px;font-weight:800;margin:0 auto 13px}
    h1{font-size:24px;margin:0 0 8px;color:#14243a}
    .sub{font-size:14px;line-height:1.5;color:#657287;margin:0}
    label{display:block;font-size:13px;font-weight:700;margin:16px 0 7px}
    input{width:100%;padding:13px 14px;border:1px solid #cfd8e4;border-radius:10px;font-size:15px;outline:none;background:#fff}
    input:focus{border-color:#3269a8;box-shadow:0 0 0 3px rgba(50,105,168,.12)}
    button{width:100%;border:0;border-radius:10px;background:#16834a;color:#fff;padding:15px;font-size:16px;font-weight:700;margin-top:22px;cursor:pointer}
    button:active{transform:scale(.99)}
    .note{font-size:12px;color:#718096;line-height:1.5;text-align:center;margin:14px 0 0}
    .required{color:#d33}
    footer{text-align:center;font-size:12px;color:#8a95a5;margin-top:22px}
  </style>
</head>
<body>
  <main class="card">
    <header class="top">
      <div class="mark">5M</div>
      <h1>5-Sem Mechanical</h1>
      <p class="sub">Student Information Form<br>Enter your details correctly and submit through WhatsApp.</p>
    </header>

    <form id="studentForm">
      <label for="name">Full Name <span class="required">*</span></label>
      <input id="name" name="name" type="text" placeholder="Enter your full name" autocomplete="name" required maxlength="100">

      <label for="reg">Register Number <span class="required">*</span></label>
      <input id="reg" name="reg" type="text" placeholder="Enter your register number" required maxlength="40">

      <label for="email">Gmail Address <span class="required">*</span></label>
      <input id="email" name="email" type="email" placeholder="example@gmail.com" autocomplete="email" required maxlength="120">

      <label for="phone">Phone Number <span class="required">*</span></label>
      <input id="phone" name="phone" type="tel" placeholder="Enter your phone number" inputmode="tel" autocomplete="tel" pattern="[0-9+() -]{7,20}" required maxlength="20">

      <button type="submit">Submit via WhatsApp</button>
    </form>
    <p class="note">After tapping submit, WhatsApp will open with your details. Please press <b>Send</b> in WhatsApp to complete your submission.</p>
    <footer>5-Sem Mechanical • Student Details Collection</footer>
  </main>

  <script>
    const WHATSAPP_NUMBER = "918050101128"; // India country code +91
    document.getElementById("studentForm").addEventListener("submit", function(event) {
      event.preventDefault();
      if (!this.reportValidity()) return;

      const name = document.getElementById("name").value.trim();
      const reg = document.getElementById("reg").value.trim();
      const email = document.getElementById("email").value.trim();
      const phone = document.getElementById("phone").value.trim();

      const message = [
        "5-SEM MECH — STUDENT INFORMATION",
        "",
        "Name: " + name,
        "Register Number: " + reg,
        "Gmail: " + email,
        "Phone Number: " + phone
      ].join("\n");

      const url = "https://wa.me/" + WHATSAPP_NUMBER + "?text=" + encodeURIComponent(message);
      window.location.href = url;
    });
  </script>
</body>
</html>
